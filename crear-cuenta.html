<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="titulo-pagina">crear cuenta</h1>
    <main class="pagina">
        <header>
            <div class="barra-superior">
                <a class="logo-principal" href="index.html"><img src="pclogo.png" alt="PC Gamer"></a>
                <div class="buscador">
                    <input type="search" aria-label="Buscar">
                    <span>⌕</span>
                </div>
                <div class="iconos-header">
                    <a href="iniciar-sesion.html"><img src="bx-user.png" alt="Usuario"></a>
                    <a href="carrito.html"><img src="bx-cart-alt-2.png" alt="Carrito"></a>
                </div>
            </div>
            <nav>
                <a href="productos.html">PRODUCTOS</a>

                <a href="pcarmada.html">PC ARMADAS</a>
                <a href="ayuda.html">AYUDA</a>
            </nav>
        </header>

        <section class="registro">
            <form class="caja-registro" id="form-registro" novalidate>
                <h1 class="titulo-cuenta">CREAR CUENTA</h1>
                <div class="grilla-registro">
                    <div class="campo-formulario">
                        <label for="nombre">Nombre y Apellido</label>
                        <input id="nombre" type="text">
                    </div>
                    <div class="campo-formulario">
                        <label for="registro-email">Email</label>
                        <input id="registro-email" type="email">
                    </div>
                    <div class="campo-formulario">
                        <label for="registro-password">CONTRASEÑA</label>
                        <input id="registro-password" type="password">
                    </div>
                    <div class="campo-formulario">
                        <label for="registro-repetir">Repetir Contraseña</label>
                        <input id="registro-repetir" type="password">
                    </div>
                    <div class="campo-formulario campo-completo">
                        <label for="telefono">Telefono</label>
                        <input id="telefono" type="tel">
                    </div>
                </div>
                <p class="aviso-consulta" id="aviso-registro" aria-live="polite"></p>
                <button class="boton" type="submit">Crear Cuenta</button>
                <p class="texto-cuenta">¿Ya tenés cuenta? <a href="iniciar-sesion.html">Iniciá sesión</a></p>
            </form>
        </section>

        <footer>
            <h2>Contacto</h2>
            <div class="grilla-contacto">
                <a class="item-contacto" href="https://wa.me/5491123433465" target="_blank" rel="noopener">
                    <img src="icono-whatsapp.png" alt="">
                    <div><small>WhatsApp</small><p>+54 11 2343-3465</p></div>
                </a>
                <a class="item-contacto" href="mailto:pcgamingstore@gmail.com">
                    <img src="icono-mail.svg" alt="">
                    <div><small>Email</small><p>pcgamingstore@gmail.com</p></div>
                </a>
                <a class="item-contacto" href="https://www.google.com/maps/search/?api=1&amp;query=Florida+537+CABA" target="_blank" rel="noopener">
                    <img src="icono-ubicacion.png" alt="">
                    <div><small>Local</small><p>Florida 537 local 379, CABA</p></div>
                </a>
                <a class="item-contacto" href="https://www.instagram.com/pcgamingstore" target="_blank" rel="noopener">
                    <img src="icono-instagram.png" alt="">
                    <div><small>Instagram</small><p>@pcgamingstore</p></div>
                </a>
            </div>
            <div class="pie-inferior">
                <a href="https://www.instagram.com/pcgamingstore" target="_blank" rel="noopener">@PCGAMINGSTORE</a>
                <a href="terminos.html">Terminos y Condiciones</a>
